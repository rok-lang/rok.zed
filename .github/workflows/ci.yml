name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Generated queries and grammar revs must match rok-syntax.rev.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync --check

  # Every query must compile against the pinned grammars.
  queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rev
        run: echo "rev=$(cat rok-syntax.rev)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: rok-lang/rok-syntax
          ref: ${{ steps.rev.outputs.rev }}
          path: rok-syntax
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix rok-syntax
      - run: scripts/check-queries rok-syntax

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip2
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-wasip2 -- -D warnings
      - run: cargo build --release --target wasm32-wasip2
