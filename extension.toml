id = "rok"
name = "Rok"
version = "0.2.0"
schema_version = 1
authors = ["Han Damin <miniex@daminstudio.net>"]
description = "Rok language support: tree-sitter highlighting for .rok and .rokon, and the rokls language server."
repository = "https://github.com/rok-lang/rok.zed"

[grammars.rok]
repository = "https://github.com/rok-lang/rok-syntax"
rev = "740423a5c03a1145da744cee4c71d01d2fde2e4f"
path = "tree-sitter/rok"

[grammars.rokon]
repository = "https://github.com/rok-lang/rok-syntax"
rev = "740423a5c03a1145da744cee4c71d01d2fde2e4f"
path = "tree-sitter/rokon"

[language_servers.rokls]
name = "rokls"
languages = ["Rok"]

[language_servers.rokls.language_ids]
"Rok" = "rok"
